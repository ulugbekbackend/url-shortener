[project]
name = "linkly-backend"
version = "1.0.0"
description = "URL Shortener & Analytics - FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "redis[hiredis]==8.1.0",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "orjson==3.12.0",
    "python-multipart==0.0.32",
    "segno==1.6.6",
    "user-agents==2.2.0",
    "geoip2==5.3.0",
    "jinja2==3.1.6",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated by Alembic, never edited by hand
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.isort]
# ./alembic holds our migrations; the import is the third-party package
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# user-agents ships no type information
module = ["user_agents", "user_agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the app's engine and Redis client are module globals
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs our code inside greenlets
concurrency = ["greenlet", "thread"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

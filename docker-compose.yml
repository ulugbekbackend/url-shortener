x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  # Secrets and settings come from backend/.env (copy backend/.env.example);
  # only the service hostnames differ inside the compose network
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations first, then the dev server with auto-reload
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *backend
    # Healthy backend = migrations applied
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.workers.click_worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      # Keep the image's Linux node_modules instead of the host's
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
